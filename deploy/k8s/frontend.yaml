apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ocr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      hostNetwork: true
      terminationGracePeriodSeconds: 2
      containers:
        - name: frontend
          image: ocr-api:local
          imagePullPolicy: IfNotPresent
          command: ["/opt/node/bin/node", "/frontend/server.mjs"]
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: API_TARGET
              value: "http://10.43.29.141:5000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: frontend-dir
              mountPath: /frontend
            - name: node-runtime
              mountPath: /opt/node
              readOnly: true
            - name: libatomic
              mountPath: /usr/lib/x86_64-linux-gnu/libatomic.so.1
              readOnly: true
      volumes:
        - name: frontend-dir
          hostPath:
            path: /home/utec/ocr/frontend
            type: Directory
        - name: node-runtime
          hostPath:
            path: /home/utec/.nvm/versions/node/v26.13.0
            type: Directory
        - name: libatomic
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libatomic.so.1
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ocr
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
