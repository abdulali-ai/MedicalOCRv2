# Host-side vLLM (PM2). Keeps DNS name `vllm` so workers keep using
# http://vllm:8000/v1 without talking to a GPU container in the cluster.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ocr
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vllm
  namespace: ocr
subsets:
  - addresses:
      # k3s node IP on the pod network (host gateway).
      - ip: 10.42.0.1
    ports:
      - name: http
        port: 8000
