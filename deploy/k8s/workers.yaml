apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-worker
  namespace: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-worker
  template:
    metadata:
      labels:
        app: pdf-worker
    spec:
      containers:
        - name: pdf-worker
          image: ocr-api:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.services.pdf_worker"]
          envFrom:
            - configMapRef:
                name: ocr-config
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: app-code
              mountPath: /app/app
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ocr-storage
        - name: app-code
          hostPath:
            path: /home/utec/ocr/app
            type: Directory
---
