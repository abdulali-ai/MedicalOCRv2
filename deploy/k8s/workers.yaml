apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: ocr
spec:
  schedule: "17 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ocr-api:local
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.services.cleanup"]
              envFrom:
                - configMapRef:
                    name: ocr-config
              volumeMounts:
                - name: storage
                  mountPath: /data
                - name: app-code
                  mountPath: /app/app
          volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: ocr-storage
            - name: app-code
              hostPath:
                path: /home/utec/ocr/app
                type: Directory
